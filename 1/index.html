<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nová karta - Složka 1</title>
    <style>
      :root {
        --bg-color: #1e1f20;
        --chat-bg: #131314;
        --input-bg: #282a2c;
        --text-color: #e3e3e3;
        --accent-color: #c4c7c5;
        --user-msg-bg: #303134;
        --bot-msg-bg: transparent;
      }

      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* Hlavní obal aplikace - ve výchozím stavu skrytý */
      #app-wrapper {
        display: none; /* Skryto, dokud se nezadá heslo */
        flex-direction: column;
        height: 100vh;
        width: 100%;
        position: relative;
      }

      /* Kontejner pro navigační tlačítka vpravo nahoře */
      .nav-wrapper {
        position: absolute;
        top: 15px;
        right: 20px;
        display: flex;
        gap: 8px; /* Mezera mezi tlačítky */
        z-index: 100;
      }

      /* Styl tlačítek */
      .top-nav-btn {
        background-color: #303134;
        color: #c4c7c5;
        text-decoration: none;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #555;
        font-size: 14px;
        font-weight: bold;
        transition: all 0.2s;
      }

      .top-nav-btn:hover {
        background-color: #444;
        color: white;
        border-color: #888;
      }

      /* Oblast chatu */
      #chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
        padding-top: 50px; /* Aby text nebyl pod navigačním tlačítkem */
      }

      .message {
        line-height: 1.6;
        padding: 10px 15px;
        border-radius: 12px;
        max-width: 85%;
        word-wrap: break-word;
        position: relative; /* Pro pozicování tlačítka kopírovat */
      }

      .user-message {
        align-self: flex-end;
        background-color: var(--user-msg-bg);
        border-bottom-right-radius: 2px;
      }

      .bot-message {
        align-self: flex-start;
        background-color: var(--bot-msg-bg);
        padding-right: 90px; /* Místo pro tlačítko, aby nepřekrývalo text */
        border: 1px solid #333; /* Jemný rámeček pro bot zprávy */
      }

      .bot-message strong {
        color: #8ab4f8;
      }

      /* Tlačítko pro kopírování - VŽDY VIDITELNÉ */
      .copy-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #2d2e30;
        border: 1px solid #555;
        border-radius: 6px;
        color: #c4c7c5;
        cursor: pointer;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: bold;
        transition: all 0.2s;
        display: inline-block;
        z-index: 10;
      }

      .copy-btn:hover {
        background: #444;
        color: white;
        border-color: #888;
      }

      .copy-btn:active {
        background: #4caf50;
        border-color: #4caf50;
        color: white;
      }

      /* Vstupní oblast */
      #input-area {
        background-color: var(--chat-bg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-top: 1px solid #444;
      }

      #input-wrapper {
        background-color: var(--input-bg);
        border-radius: 24px;
        padding: 10px 20px;
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        border: 1px solid transparent;
        transition: border-color 0.2s;
      }

      #input-wrapper:focus-within {
        background-color: #303134;
        border-color: #555;
      }

      #preview-container {
        display: none;
        padding: 10px 0;
      }
      #preview-image {
        max-height: 100px;
        border-radius: 8px;
        border: 1px solid #555;
      }

      textarea {
        background: transparent;
        border: none;
        color: white;
        resize: none;
        font-size: 16px;
        width: 100%;
        outline: none;
        max-height: 200px;
        font-family: inherit;
      }

      #controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 5px;
      }

      .right-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status {
        font-size: 12px;
        color: #666;
      }

      button {
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--accent-color);
        padding: 8px;
        border-radius: 50%;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .icon-svg svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div id="app-wrapper">
      <div class="nav-wrapper" id="auto-nav"></div>

      <script>
        (function () {
          const container = document.getElementById("auto-nav");
          const totalPages = 12; // Nastaveno na 20 (Rozsah 0 až 19)

          // 1. ZJISTÍME, KDE JSME
          let currentId = 0;
          const pathSegments = window.location.pathname.split("/");
          for (const segment of pathSegments) {
            if (/^\d+$/.test(segment)) {
              currentId = parseInt(segment);
              break;
            }
          }

          // 2. VYGENERUJEME TLAČÍTKA
          for (let i = 0; i < totalPages; i++) {
            if (i === currentId) continue; // Nevykreslovat tlačítko pro aktuální stránku

            const a = document.createElement("a");
            a.className = "top-nav-btn";
            a.textContent = i;

            // Nastavení relativní cesty (bezpečné pro jakýkoliv hosting)
            if (currentId === 0) {
              // Jsme v ROOTU (0) -> jdeme do podsložky
              a.href = `${i}/index.html`;
            } else {
              // Jsme v PODSLOŽCE
              if (i === 0) {
                // Zpět na root (o úroveň výš)
                a.href = `../index.html`;
              } else {
                // Do jiné podsložky (o úroveň výš a pak do správné složky)
                a.href = `../${i}/index.html`;
              }
            }

            container.appendChild(a);
          }
        })();
      </script>

      <div id="chat-container">
        <div class="message bot-message">Ahoj! Jsem ready na všechno.</div>
      </div>

      <div id="input-area">
        <div id="input-wrapper">
          <div id="preview-container">
            <img id="preview-image" src="" alt="Náhled" />
          </div>
          <textarea
            id="user-input"
            rows="1"
            placeholder="Zadejte prompt... (Ctrl+V nebo foťák)"
          ></textarea>
          <div id="controls">
            <span id="status-text" class="status">Gemini 2.5 Flash</span>

            <div class="right-controls">
              <input
                type="file"
                id="camera-input"
                accept="image/*"
                capture="environment"
                style="display: none"
              />

              <button id="camera-btn" title="Vyfotit">
                <div class="icon-svg">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                      style="display: none"
                    />
                    <path
                      d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"
                    />
                  </svg>
                </div>
              </button>

              <button id="send-btn" title="Odeslat">
                <div class="icon-svg">
                  <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                  </svg>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ================= BEZPEČNOST ================= */
      window.addEventListener("load", () => {
        const password = prompt("Zadej přístupové heslo:");
        if (password === "999") {
          document.getElementById("app-wrapper").style.display = "flex";
          document.getElementById("user-input").focus();
        } else {
          document.body.innerHTML =
            "<h1 style='text-align:center; margin-top:50px; color:red;'>Přístup zamítnut</h1>";
        }
      });
      /* =============================================== */

      /* ================= KONFIGURACE ================= */

      // 1. ZDE VLOŽ SVŮJ KLÍČ
      const API_KEY = "AIzaSyASLw_YrxG-GYzolU7LLg-0oQtoPJakeiM";

      // 2. Model - Flash je nejrychlejší a stabilní
      const MODEL_NAME = "gemini-2.5-flash";

      // 3. Tvůj vyladěný prompt (Základy digitálních systémů)
      const SYSTEM_PROMPT = `
Jsi expert na předmět Základy softwarové inženýrství. Tvým úkolem je řešit příklady co nejstručněji a nejpřesněji.

Témata zahrnují: diagramy tříd, ER diagramy, UML, návrhové vzory, algoritmy, datové struktury, OOP, testování, agilní metodiky a další.

Pravidla pro tvé odpovědi:
1. PŘÍMÁ ODPOVĚĎ: Pokud je otázka jasná (převod, výpočet), napiš POUZE výsledek. Nepoužívej úvodní věty jako "Výsledek je...".
2. VÝBĚR Z MOŽNOSTÍ: Pokud vidíš možnosti (radio buttony), napiš přesné znění té správné (případně písmeno, pokud tam je).
3. VÍCE OTÁZEK: Pokud obrázek obsahuje více polí pro vyplnění, vypiš odpovědi jako odrážkový seznam, aby bylo jasné, co kam patří.
4. SLOŽITĚJŠÍ ÚLOHY: Pouze pokud je úloha komplexní a výsledek není jedno číslo, stručně popiš kroky řešení, ale výsledek VŽDY zvýrazni (tučně).
5. FORMÁT: Čísla piš tak, jak se očekávají ve formuláři (např. bez mezer, pokud to není nutné).

Používej pro desetinná čísla , ne .

Odpovědi pouze jako čístý text bez formátování.

Jazyk: Čeština.
`;
      /* =============================================== */

      const chatContainer = document.getElementById("chat-container");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const previewContainer = document.getElementById("preview-container");
      const previewImage = document.getElementById("preview-image");
      const statusText = document.getElementById("status-text");

      // Elementy pro kameru
      const cameraBtn = document.getElementById("camera-btn");
      const cameraInput = document.getElementById("camera-input");

      let currentImageBase64 = null;
      let chatHistory = [];

      // Automatická výška textarea
      userInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
        if (this.value === "") this.style.height = "auto";
      });

      // Zpracování obrázku (Base64)
      function handleImageFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64String = event.target.result;
          currentImageBase64 = base64String.split(",")[1];
          previewImage.src = base64String;
          previewContainer.style.display = "block";
          statusText.textContent = "Obrázek připraven";
        };
        reader.readAsDataURL(file);
      }

      // === LOGIKA FOTOAPARÁTU ===
      cameraBtn.addEventListener("click", () => {
        cameraInput.click(); // Kliknutí na skrytý input
      });

      cameraInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        handleImageFile(file);
        // Reset inputu, aby šlo vyfotit stejnou věc znovu
        event.target.value = "";
      });

      // Vložení obrázku ze schránky (Ctrl+V)
      userInput.addEventListener("paste", (event) => {
        const items = (event.clipboardData || event.originalEvent.clipboardData)
          .items;
        for (let index in items) {
          const item = items[index];
          if (item.kind === "file" && item.type.includes("image/")) {
            const blob = item.getAsFile();
            handleImageFile(blob);
          }
        }
      });

      // Odeslání Enterem
      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      sendBtn.addEventListener("click", sendMessage);

      async function sendMessage() {
        const text = userInput.value.trim();

        if (!text && !currentImageBase64) return;
        if (!API_KEY || API_KEY.includes("SEM_VLOZ")) {
          alert("Nezapomeň vložit API klíč do kódu!");
          return;
        }

        appendMessage(
          text,
          "user-message",
          currentImageBase64 ? previewImage.src : null,
        );

        userInput.value = "";
        userInput.style.height = "auto";
        previewContainer.style.display = "none";
        statusText.textContent = "Gemini počítá...";

        const parts = [];
        if (text) parts.push({ text: text });
        if (currentImageBase64) {
          parts.push({
            inline_data: {
              mime_type: "image/jpeg",
              data: currentImageBase64,
            },
          });
        }

        const tempImage = currentImageBase64;
        currentImageBase64 = null;

        chatHistory.push({ role: "user", parts: parts });

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                system_instruction: { parts: { text: SYSTEM_PROMPT } },
                contents: chatHistory,
              }),
            },
          );

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error.message);
          }

          const botText = data.candidates[0].content.parts[0].text;
          chatHistory.push(data.candidates[0].content);

          appendMessage(botText, "bot-message");
          statusText.textContent = MODEL_NAME;
        } catch (error) {
          console.error(error);
          appendMessage(`Chyba: ${error.message}`, "bot-message");
          statusText.textContent = "Chyba";
        }
      }

      function appendMessage(text, className, imgSrc = null) {
        const div = document.createElement("div");
        div.className = `message ${className}`;

        if (imgSrc) {
          const img = document.createElement("img");
          img.src = imgSrc;
          img.style.maxWidth = "200px";
          img.style.borderRadius = "8px";
          img.style.display = "block";
          img.style.marginBottom = "10px";
          div.appendChild(img);
        }

        const formattedText = text
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br>");

        const textSpan = document.createElement("span");
        textSpan.innerHTML = formattedText;
        div.appendChild(textSpan);

        // === TLAČÍTKO PRO KOPÍROVÁNÍ (FIX PRO HTTP) ===
        if (className.includes("bot-message")) {
          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-btn";
          copyBtn.innerText = "Kopírovat";
          copyBtn.title = "Vložit do schránky";

          copyBtn.onclick = function () {
            copyToClipboardFallback(text, this);
          };
          div.appendChild(copyBtn);
        }
        // ==============================================

        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // === FUNKCE PRO BEZPEČNÉ KOPÍROVÁNÍ I NA HTTP ===
      function copyToClipboardFallback(text, btnElement) {
        // Pokud je HTTPS nebo Localhost, použijeme moderní API
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              showCopySuccess(btnElement);
            })
            .catch((err) => {
              // Pokud selže, zkusíme fallback
              useTextAreaFallback(text, btnElement);
            });
        } else {
          // Pokud je HTTP (nezabezpečené), musíme použít trik s textarea
          useTextAreaFallback(text, btnElement);
        }
      }

      function useTextAreaFallback(text, btnElement) {
        const textArea = document.createElement("textarea");
        textArea.value = text;

        // Skrytí prvku mimo obrazovku
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);

        textArea.focus();
        textArea.select();

        try {
          const successful = document.execCommand("copy");
          if (successful) {
            showCopySuccess(btnElement);
          } else {
            btnElement.innerText = "Err";
          }
        } catch (err) {
          console.error("Fallback copy failed", err);
          btnElement.innerText = "Err";
        }

        document.body.removeChild(textArea);
      }

      function showCopySuccess(btn) {
        const originalText = "Kopírovat";
        btn.innerText = "Zkopírováno!";
        btn.style.borderColor = "#4caf50";
        btn.style.color = "#4caf50";

        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.borderColor = "#555";
          btn.style.color = "#c4c7c5";
        }, 1500);
      }
    </script>
  </body>
</html>
